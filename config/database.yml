# Production reads DATABASE_URL. Development and test do not, because Rails
# would let it override either one, and specs could then erase development data.
default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 12) %>

development:
  <<: *default
  url: <%= ENV.fetch("DEVELOPMENT_DATABASE_URL", "postgresql://postgres:postgres@db:5432/blackbook_dev") %>

test:
  <<: *default
  url: <%= ENV.fetch("TEST_DATABASE_URL", "postgresql://postgres:postgres@db-test:5432/blackbook_test") %>

production:
  <<: *default
