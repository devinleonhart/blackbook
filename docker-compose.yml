services:
  web:
    # One image for web and css, so building either renews both.
    image: blackbook-dev
    build:
      context: .
      target: dev
    depends_on:
      db:
        condition: service_healthy
      db-test:
        condition: service_healthy
    environment:
      DEVELOPMENT_DATABASE_URL: postgresql://postgres:postgres@db:5432/blackbook_dev
      TEST_DATABASE_URL: postgresql://postgres:postgres@db-test:5432/blackbook_test
    volumes:
      - .:/app
    ports:
      - "3001:3000"

  # Rebuilds the stylesheet as views change.
  css:
    image: blackbook-dev
    build:
      context: .
      target: dev
    entrypoint: []
    command: bin/rails tailwindcss:watch[poll]
    volumes:
      - .:/app
    tty: true
    healthcheck:
      disable: true

  db:
    image: postgres:18.7
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: blackbook_dev
    volumes:
      - pgdata_18:/var/lib/postgresql
    healthcheck: &postgres_health
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  db-test:
    image: postgres:18.7
    ports:
      - "5435:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: blackbook_test
    healthcheck: *postgres_health

volumes:
  pgdata_18:
