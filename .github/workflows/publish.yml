name: CI/CD Pipeline

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

# Least privilege by default; jobs opt into more only if they need it.
permissions:
  contents: read

# One run per ref: a new push cancels the in-flight run for that branch/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-check:
    name: Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build test image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: dev
          load: true
          tags: blackbook:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start test database
        run: |
          docker network create blackbook-test-net
          docker run -d --name postgres-test --network blackbook-test-net \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=blackbook_test \
            postgres:18.7
          timeout 60 sh -c 'until docker exec postgres-test pg_isready -h 127.0.0.1 -U postgres; do sleep 1; done'

      - name: Run linters, security scans and specs
        run: |
          docker run --rm --network blackbook-test-net \
            -v "$GITHUB_WORKSPACE:/app" \
            -e RAILS_ENV=test \
            -e TEST_DATABASE_URL=postgresql://postgres:postgres@postgres-test:5432/blackbook_test \
            blackbook:test bin/ci

      - name: Cleanup
        if: always()
        run: |
          docker rm -f postgres-test || true
          docker network rm blackbook-test-net || true

  # Builds the production image on every run so a broken Dockerfile fails the
  # PR, not the master push. Only pushes to master log in and publish the
  # image. Deploying to the server is a separate manual step.
  image:
    name: Build & Push
    runs-on: ubuntu-latest
    needs: quality-check
    timeout-minutes: 15
    env:
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to DockerHub
        if: env.PUBLISH == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # :latest for the server, and the short commit SHA to roll back to.
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: devleo/blackbook
          tags: |
            type=raw,value=latest
            type=raw,value=master-{{sha}}

      - name: Build image (and push on master)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Attestations are attached to the pushed image only.
          sbom: ${{ env.PUBLISH == 'true' }}
          provenance: ${{ env.PUBLISH == 'true' }}
          # Persistent layer cache across runs; skips reinstalling dependencies
          # when the lockfile is unchanged.
          cache-from: type=gha
          cache-to: type=gha,mode=max
